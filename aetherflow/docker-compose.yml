services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aetherflow
      POSTGRES_USER: aetherflow
      POSTGRES_PASSWORD: aetherflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherflow -d aetherflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      DATABASE_URL: "postgres://aetherflow:aetherflow@postgres:5432/aetherflow?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_STREAM: "aetherflow:tasks"
      REDIS_GROUP: "aetherflow-workers"
      OTLP_ENDPOINT: ""
      WORKER_CONCURRENCY: "4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"

volumes:
  postgres_data:
